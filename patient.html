<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Page</title>
</head>
<style>
    body {
            background: linear-gradient(135deg, #0A2A66 0%, #081F4D 25%, #061735 50%, #081F4D 75%, #0A2A66 100%);
            background-color: #061735;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        .name-header {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 40px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .name-header h1 {
            color: #e8f0ff;
            font-size: 38px;
            font-weight: 600;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 0;
            text-transform: uppercase;
            line-height: 1.2;
        }

        .name-header h2 {
            display: none;
        }
        .main-container {
        width: 90%;
        max-width: 1100px;
        background: white;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        overflow: auto;
        }

</style>
<body>
    <div class="name-header">
        <h1>Ασθενής</h1>
    </div>

      <div class="main-container">
        <h2>Περιεχόμενο Σελίδας</h2>
        <pre>
        <pre>ραντεβού και αποτελέσματα εξετάσεων</pre>
        <pre>προσωπικά στοιχεία και ιατρικό ιστορικό</pre>
        <pre>επικοινωνία με γιατρούς και γραμματεία</pre>
        <pre>προβολή και διαχείριση ραντεβού</pre>
        <pre>προβολή αποτελεσμάτων εξετάσεων</pre>




         
        </pre>
    </div>
</body>
</html>
