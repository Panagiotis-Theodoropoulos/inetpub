<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Σελίδα Ασθενούς</title>
<style>
body {
    background: linear-gradient(135deg, #0A2A66, #061735);
    font-family: system-ui, -apple-system, Segoe UI, Arial;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px;
    margin: 0;
}

.name-header h1 {
    color: #fef1f1;
    margin-bottom: 20px;
    font-size: 45px;
    font-family: Arial, Helvetica, sans-serif;
    font-style: italic;
    text-shadow: 0 2px 10px rgba(90, 108, 241, 0.3);
}

.container {
    width: 95%;
    max-width: 1000px;
    background: white;
    border-radius: 25px;
    padding: 25px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
}

.container h1 {
    text-align: center;
    color: #0A2A66;
    margin-bottom: 25px;
}

.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
}

.tab {
    flex: 1;
    padding: 14px;
    text-align: center;
    background: #eef1f7;
    border-radius: 14px;
    cursor: pointer;
    font-weight: 500;
    transition: 0.3s;
}

.tab:hover {
    background: #dfe6f5;
}

.tab.active {
    background: #0A2A66;
    color: white;
}

.content {
    display: none;
}

.content.active {
    display: block;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.full {
    grid-column: span 2;
}

.card {
    background: #f7f9fc;
    padding: 18px;
    border-radius: 16px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.05);
}
.edit-input{
    width: 100%;
    padding: 10px;
    border: 1px solid #d6dce8;
    border-radius: 10px;
    font-size: 16px;
    box-sizing: border-box;
    background: white;
    color: #111;
    margin-top: 5px;
}

.edit-input:focus{
    outline: none;
    border-color: #0A2A66;
}
.label {
    font-size: 13px;
    color: #666;
    margin-bottom: 6px;
}

.value {
    font-size: 18px;
    font-weight: bold;
    color: #111;
}

.file-label {
    display: block;
    background: #0A2A66;
    color: white;
    padding: 12px;
    border-radius: 10px;
    text-align: center;
    cursor: pointer;
    margin-top: 10px;
    transition: 0.3s;
}

.file-label:hover {
    background: #123a85;
}

.btn {
    display: inline-block;
    background: #0A2A66;
    color: white;
    padding: 12px 18px;
    border-radius: 12px;
    text-decoration: none;
    margin-top: 10px;
    border: none;
    cursor: pointer;
    font-size: 16px;
    transition: 0.3s;
}

.btn:hover {
    background: #123a85;
}

.btn:disabled {
    cursor: not-allowed;
}

.messages {
    max-height: 300px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 10px 0;
}

.message {
    max-width: 75%;
    padding: 12px;
    border-radius: 12px;
    background: #eef2ff;
    font-size: 15px;
}

.message.user {
    background: #0A2A66;
    color: white;
    margin-left: auto;
}

.chat-box {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.chat-box textarea {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #ccc;
    resize: none;
    font-size: 15px;
}

.chat-box button {
    background: #0A2A66;
    color: white;
    border: none;
    padding: 10px 14px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
}

.chat-box button:hover {
    background: #123a85;
}

.visually-hidden {
    position: absolute;
    left: -9999px;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    font-size: 13px;
    color: #666;
    margin-bottom: 5px;
}

.form-group input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 16px;
    box-sizing: border-box;
}

.checkbox-group {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin: 20px 0;
}

.checkbox-group input[type="checkbox"] {
    width: 20px;
    height: 20px;
    margin-top: 2px;
}

.checkbox-group label {
    font-size: 14px;
    color: #333;
}

#fileName {
    margin-top: 10px;
    color: green;
    font-weight: bold;
}

#successMessage {
    display: none;
    margin-top: 15px;
    color: green;
    font-weight: bold;
}
</style>
</head>
<body>

<div class="name-header">
    <h1>PetSync</h1>
</div>

<div class="container">

    <h1>Σελίδα Ασθενούς</h1>

    <div class="tabs">
        <div class="tab active" onclick="showTab(0)">Καρτέλα</div>
        <div class="tab" onclick="showTab(1)">Μηνύματα</div>
    </div>

    <!-- ΚΑΡΤΕΛΑ -->
    <div class="content active">

        <div class="grid">

            <div class="card">
                <label for="name">Όνομα</label>
                <input id="name" class="edit-input" value="Γιώργος">
            </div>

            <div class="card">
                <label for="surname">Επώνυμο</label>
                <input id="surname" class="edit-input" value="Παπαδόπουλος">
            </div>

            <div class="card">
                <label for="amka">ΑΜΚΑ</label>
                <input id="amka" class="edit-input" value="19026285734">
            </div>

            <div class="card">
                <label for="birth">Ημερομηνία Γέννησης</label>
                <input id="birth" class="edit-input" value="19/02/1962">
            </div>

            <div class="card">
                <label for="height">Ύψος</label>
                <input id="height" class="edit-input" value="175 cm">
            </div>

            <div class="card">
                <label for="weight">Βάρος</label>
                <input id="weight" class="edit-input" value="82 kg">
            </div>

            <div class="card full">
                <label for="diabetes">Διαβήτης</label>
                <input id="diabetes" class="edit-input" value="Ναι">
            </div>

            <!-- Παραπέμπτικό -->
            <div class="card full">

                <div class="label">Παραπεμπτικό</div>

                <label for="fileUpload" class="file-label">
                    Ανεβάστε το παραπεμπτικό
                </label>

                <input type="file" id="fileUpload" hidden>

                <div id="fileName"></div>

            </div>

            <!-- Αίτημα -->
            <div class="card full">

                <div class="label">Αίτημα προς Γραμματεία</div>

                <input
                    type="text"
                    id="reason"
                    class="edit-input"
                    placeholder="Λόγος επίσκεψης"
                >

                <div class="checkbox-group">

                    <input type="checkbox" id="termsCheck">

                    <label for="termsCheck">
                        Αποδέχομαι τους όρους χρήσης
                    </label>

                </div>

                <button class="btn" id="submitBtn" onclick="submitRequest()">
                    Αποστολή στη Γραμματεία
                </button>

                <div id="successMessage">
                    Το αίτημα στάλθηκε επιτυχώς
                </div>

            </div>

        </div>

    </div>
    <div class="content">
        <div class="messages" id="messages">
          <div class="message user">
    Αγαπητέ ασθενή, το ραντεβού σας στις 08/04/2026 εγκρίθηκε.
</div>
<div class="message bot">
    Εντάξει, ευχαριστώ.
</div>
<div class="message user">
    Υπενθύμιση: έχετε ραντεβού στις 08/04/2026.
</div>
<div class="message user">
    Υπενθύμιση: έχετε ραντεβού στις 08/04/2026.
</div>
        </div>

        <div class="chat-box">

            <textarea id="msgInput" rows="2" placeholder="Γράψε μήνυμα..."></textarea>

            <button onclick="sendMsg()">➤</button>

        </div>

    </div>

</div>

<script>

function showTab(i){

    document.querySelectorAll(".tab").forEach((tab, index) => {
        tab.classList.toggle("active", index === i);
    });

    document.querySelectorAll(".content").forEach((content, index) => {
        content.classList.toggle("active", index === i);
    });

}

function sendMsg(){

    let input = document.getElementById("msgInput");

    let text = input.value.trim();

    if(!text) return;

    let div = document.createElement("div");

    div.className = "message user";

    div.textContent = text;

    document.getElementById("messages").appendChild(div);

    input.value = "";

}

const fileUpload = document.getElementById("fileUpload");

fileUpload.addEventListener("change", function(){

    if(this.files.length > 0){

        document.getElementById("fileName").textContent =
            "✔ Ανέβηκε αρχείο: " + this.files[0].name;

    }

});

let requestSent = false;

function submitRequest(){

    if(requestSent){
        return;
    }

    const termsCheck =
        document.getElementById("termsCheck");

    if(!termsCheck.checked){

        alert("Πρέπει να αποδεχτείτε τους όρους χρήσης.");
        return;
    }
    if(fileUpload.files.length === 0){
        alert("Παρακαλώ ανεβάστε το παραπεμπτικό.");
        return;
    }
    requestSent = true;
    document.getElementById("successMessage")
        .style.display = "block";
    const btn =
        document.getElementById("submitBtn");
    btn.textContent =
        "Το αίτημα στάλθηκε ήδη στη γραμματεία";
    btn.disabled = true;
    btn.style.opacity = "0.7";
}

</script>
</body>
</html>
